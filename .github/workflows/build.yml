name: Build playbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml py7zr
      - name: Validate
        run: python3 tools/validate.py
      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: apbx-${{ github.sha }}
          path: dist/*.apbx
