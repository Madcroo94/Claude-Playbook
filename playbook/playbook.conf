<?xml version="1.0" encoding="utf-8"?>
<!--
  Claude Playbook: Windows 11 24H2/25H2 tuned for gaming and AI work.
  UniqueId is fixed for this playbook; never change it or copy it into another
  playbook. Bump Version for every release; the Git release tag must match it.
  Every CheckboxOption sets IsChecked explicitly (AME defaults it to true).
-->
<Playbook>
  <Name>Claude Playbook</Name>
  <Username>Madcroo94</Username>
  <UniqueId>fe1958c3-ae31-4c09-891e-7118420623ce</UniqueId>
  <ShortDescription>Lean Windows 11 for gaming and AI work</ShortDescription>
  <Title>Claude Playbook for Windows 11</Title>
  <Description>Claude Playbook removes bloat, ads and telemetry from Windows 11 and tunes it for low-latency gaming and AI work.&#xD;&#xA;&#xD;&#xA;Defender, Windows Update, the Microsoft Store, WebView2 and your GPU drivers stay. Every change can be undone from the ClaudePlaybook folder in C:\Windows.&#xD;&#xA;&#xD;&#xA;Test build: apply it inside a virtual machine first.</Description>
  <Details>Debloat, privacy and latency tuning for Windows 11 24H2/25H2. Removes Edge, Xbox, Copilot and OneDrive on request, keeps Defender, Windows Update, Store and WebView2, and ships an undo toolbox.</Details>
  <ProgressText>Removing bloat, turning off telemetry and ads, and tuning Windows for gaming and AI work. A backup of every setting is taken first.</ProgressText>
  <Version>0.2.0</Version>
  <SupportedBuilds>
    <string>26100</string> <!-- 24H2 -->
    <string>26200</string> <!-- 25H2 -->
  </SupportedBuilds>
  <Requirements>
    <Requirement>Internet</Requirement>
    <Requirement>NoPendingUpdates</Requirement>
    <Requirement>NoAntivirus</Requirement>
    <Requirement>PluggedIn</Requirement>
    <!-- Lets AME write Defender policy; Defender itself stays installed. -->
    <Requirement>DefenderToggled</Requirement>
  </Requirements>
  <Git>https://github.com/Madcroo94/Claude-Playbook</Git>
  <FeaturePages>
    <RadioPage IsRequired="true" DefaultOption="defender-keep" Description="Defender protects you from malware. Turning it off is for advanced users only.">
      <TopLine Text="Microsoft Defender"/>
      <Options>
        <RadioOption>
          <Text>Keep Defender on (recommended)</Text>
          <Name>defender-keep</Name>
        </RadioOption>
        <RadioOption>
          <Text>Turn Defender off</Text>
          <Name>defender-disable</Name>
        </RadioOption>
      </Options>
      <BottomLine Text="Choosing Keep on a later run turns Defender back on."/>
    </RadioPage>
    <RadioPage IsRequired="true" DefaultOption="updates-default" Description="Security updates keep coming either way. Choose who decides when they install.">
      <TopLine Text="Windows Update"/>
      <Options>
        <RadioOption>
          <Text>Windows default (recommended)</Text>
          <Name>updates-default</Name>
        </RadioOption>
        <RadioOption>
          <Text>Ask before installing, never restart while I am signed in</Text>
          <Name>updates-notify</Name>
        </RadioOption>
      </Options>
    </RadioPage>
    <CheckboxPage Description="Choose what to remove. Everything here can be reinstalled later.">
      <TopLine Text="Remove apps"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Bloat apps (Bing, Clipchamp, Solitaire, Widgets, Teams, Outlook, ...)</Text>
          <Name>remove-bloat-apps</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Microsoft Edge (WebView2 stays for apps that need it)</Text>
          <Name>remove-edge</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Xbox apps, Game Bar and Xbox services (Battle.net games such as Diablo 4 are unaffected)</Text>
          <Name>remove-xbox</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Copilot app, Recall and Click to Do</Text>
          <Name>remove-copilot</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>OneDrive (skipped if your OneDrive folder has files)</Text>
          <Name>remove-onedrive</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Phone Link</Text>
          <Name>remove-phonelink</Name>
        </CheckboxOption>
      </Options>
      <BottomLine Text="Game Pass games and games that sign in with an Xbox account need the Xbox apps. Controllers keep working."/>
    </CheckboxPage>
    <RadioPage IsRequired="true" DependsOn="remove-edge" DefaultOption="browser-brave" Description="Edge is being removed, so pick a browser to install in its place.">
      <TopLine Text="Browser"/>
      <Options>
        <RadioOption>
          <Text>Brave</Text>
          <Name>browser-brave</Name>
        </RadioOption>
        <RadioOption>
          <Text>Firefox</Text>
          <Name>browser-firefox</Name>
        </RadioOption>
        <RadioOption>
          <Text>Google Chrome</Text>
          <Name>browser-chrome</Name>
        </RadioOption>
        <RadioOption>
          <Text>None, I already have another browser</Text>
          <Name>browser-none</Name>
        </RadioOption>
      </Options>
      <BottomLine Text="Edge is only removed once another browser is found."/>
    </RadioPage>
    <CheckboxPage Description="Tweaks for smoother games and lower input latency.">
      <TopLine Text="Gaming and latency"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>High-performance power plan (best on desktops)</Text>
          <Name>gaming-power-plan</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Prioritise the game in front over background tasks</Text>
          <Name>gaming-latency</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Turn off mouse acceleration</Text>
          <Name>gaming-mouse</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Stop the Sticky Keys popup when pressing Shift five times</Text>
          <Name>gaming-stickykeys</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Turn off hibernation and Fast Startup (frees disk space)</Text>
          <Name>disable-hibernation</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Turn off Memory Integrity (more FPS, less protection)</Text>
          <Name>gaming-memory-integrity</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Settings that help Python, CUDA and other AI tooling.">
      <TopLine Text="AI and developer work"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Allow long file paths (avoids Python and Node install errors)</Text>
          <Name>dev-long-paths</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Stop "python" from opening the Microsoft Store</Text>
          <Name>dev-python-alias</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Opt out of .NET and PowerShell command-line telemetry</Text>
          <Name>dev-telemetry-optout</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Turn on WSL 2 (Linux, Docker and CUDA in WSL)</Text>
          <Name>dev-wsl</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Stop Windows Update from replacing drivers (keeps your NVIDIA/CUDA driver)</Text>
          <Name>wu-no-drivers</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Cosmetic changes. Your files and apps are not affected.">
      <TopLine Text="Interface"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Classic right-click menu (no "Show more options")</Text>
          <Name>ui-classic-menu</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>File Explorer: show file extensions and hidden files, open to This PC</Text>
          <Name>ui-explorer</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Taskbar: search icon only, no Task View, add End Task to right-click</Text>
          <Name>ui-taskbar</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Align the taskbar to the left</Text>
          <Name>ui-taskbar-left</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Dark mode</Text>
          <Name>ui-dark</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
  </FeaturePages>
</Playbook>
