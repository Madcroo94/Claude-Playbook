<?xml version="1.0" encoding="utf-8"?>
<!--
  Claude Playbook: Windows 11 24H2/25H2 tuned for gaming and AI work.
  UniqueId is fixed for this playbook; never change it or copy it into another
  playbook. Bump Version for every release; the Git release tag must match it.
  Every CheckboxOption sets IsChecked explicitly (AME defaults it to true).
  AME Wizard allows at most 4 options per page, minus one for each of TopLine
  and BottomLine, and rejects long names. tools/validate.py keeps every text
  within the lengths shipped playbooks use.
-->
<Playbook>
  <Name>Claude</Name>
  <Username>Madcroo</Username>
  <UniqueId>fe1958c3-ae31-4c09-891e-7118420623ce</UniqueId>
  <ShortDescription>Windows 11 for gaming and AI</ShortDescription>
  <Title>Claude Playbook</Title>
  <Description>Removes bloat, ads and telemetry from Windows 11 and tunes it for low-latency gaming and AI work.&#xD;&#xA;&#xD;&#xA;Defender, Windows Update, the Store and GPU drivers stay. Every change can be undone from C:\Windows\ClaudePlaybook.&#xD;&#xA;&#xD;&#xA;Test build: use a virtual machine.</Description>
  <Details>Debloat, privacy and latency tuning for Windows 11 24H2/25H2, with an undo toolbox for every change.</Details>
  <ProgressText>Removing bloat, turning off telemetry and ads, and tuning Windows for gaming and AI work. A backup of every setting is taken first.</ProgressText>
  <Version>0.2.2</Version>
  <SupportedBuilds>
    <string>26100</string> <!-- 24H2 -->
    <string>26200</string> <!-- 25H2 -->
  </SupportedBuilds>
  <Requirements>
    <Requirement>Internet</Requirement>
    <Requirement>NoPendingUpdates</Requirement>
    <Requirement>NoAntivirus</Requirement>
    <Requirement>PluggedIn</Requirement>
    <!-- Lets AME write Defender policy; Defender itself stays installed. -->
    <Requirement>DefenderToggled</Requirement>
  </Requirements>
  <Git>https://github.com/Madcroo94/Claude-Playbook</Git>
  <FeaturePages>
    <RadioPage IsRequired="true" DefaultOption="defender-keep" Description="Defender protects you from malware. Turning it off is for advanced users.">
      <TopLine Text="Microsoft Defender"/>
      <Options>
        <RadioOption>
          <Text>Keep Defender on (recommended)</Text>
          <Name>defender-keep</Name>
        </RadioOption>
        <RadioOption>
          <Text>Turn Defender off</Text>
          <Name>defender-disable</Name>
        </RadioOption>
      </Options>
      <BottomLine Text="Choosing Keep on a later run turns it back on."/>
    </RadioPage>
    <RadioPage IsRequired="true" DefaultOption="updates-default" Description="Security updates keep coming either way. Choose when they install.">
      <TopLine Text="Windows Update"/>
      <Options>
        <RadioOption>
          <Text>Windows default (recommended)</Text>
          <Name>updates-default</Name>
        </RadioOption>
        <RadioOption>
          <Text>Ask first, no restarts while signed in</Text>
          <Name>updates-notify</Name>
        </RadioOption>
      </Options>
    </RadioPage>
    <CheckboxPage Description="All can be reinstalled later. Game Pass needs the Xbox apps; controllers keep working.">
      <TopLine Text="Remove apps"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Bloat apps (Bing, Teams, Clipchamp, ...)</Text>
          <Name>remove-bloat-apps</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Microsoft Edge (WebView2 stays)</Text>
          <Name>remove-edge</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Xbox apps, Game Bar and Xbox services</Text>
          <Name>remove-xbox</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="All can be reinstalled later from the ClaudePlaybook folder.">
      <TopLine Text="Remove more apps"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Copilot, Recall and Click to Do</Text>
          <Name>remove-copilot</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>OneDrive (kept if it holds files)</Text>
          <Name>remove-onedrive</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Phone Link</Text>
          <Name>remove-phonelink</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <RadioPage IsRequired="true" DependsOn="remove-edge" DefaultOption="browser-brave" Description="Pick a browser to replace Edge. Edge stays if no other browser is found.">
      <Options>
        <RadioOption>
          <Text>Brave</Text>
          <Name>browser-brave</Name>
        </RadioOption>
        <RadioOption>
          <Text>Firefox</Text>
          <Name>browser-firefox</Name>
        </RadioOption>
        <RadioOption>
          <Text>Google Chrome</Text>
          <Name>browser-chrome</Name>
        </RadioOption>
        <RadioOption>
          <Text>None, I already have another browser</Text>
          <Name>browser-none</Name>
        </RadioOption>
      </Options>
    </RadioPage>
    <CheckboxPage Description="Smoother games and lower input latency.">
      <TopLine Text="Gaming and latency"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>High-performance power plan</Text>
          <Name>gaming-power-plan</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Prioritise the game in the foreground</Text>
          <Name>gaming-latency</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Turn off mouse acceleration</Text>
          <Name>gaming-mouse</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Fewer interruptions while playing.">
      <TopLine Text="More gaming tweaks"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>No Sticky Keys popup</Text>
          <Name>gaming-stickykeys</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Turn off hibernation and Fast Startup</Text>
          <Name>disable-hibernation</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Turn off Memory Integrity (less secure)</Text>
          <Name>gaming-memory-integrity</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Settings that help Python, CUDA and other AI tooling.">
      <TopLine Text="AI and developer work"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Allow long file paths</Text>
          <Name>dev-long-paths</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Stop python from opening the Store</Text>
          <Name>dev-python-alias</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Opt out of .NET and PowerShell telemetry</Text>
          <Name>dev-telemetry-optout</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Optional extras. Blocking driver updates keeps your NVIDIA/CUDA driver.">
      <TopLine Text="WSL and drivers"/>
      <Options>
        <CheckboxOption IsChecked="false">
          <Text>Turn on WSL 2 (Linux, Docker, CUDA)</Text>
          <Name>dev-wsl</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Keep Windows Update away from drivers</Text>
          <Name>wu-no-drivers</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Cosmetic changes. File Explorer also opens to This PC.">
      <TopLine Text="Interface"/>
      <Options>
        <CheckboxOption IsChecked="true">
          <Text>Classic right-click menu</Text>
          <Name>ui-classic-menu</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Show file extensions and hidden files</Text>
          <Name>ui-explorer</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="true">
          <Text>Slimmer taskbar, End Task on right-click</Text>
          <Name>ui-taskbar</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
    <CheckboxPage Description="Cosmetic changes. Your files and apps are not affected.">
      <TopLine Text="More interface options"/>
      <Options>
        <CheckboxOption IsChecked="false">
          <Text>Align the taskbar to the left</Text>
          <Name>ui-taskbar-left</Name>
        </CheckboxOption>
        <CheckboxOption IsChecked="false">
          <Text>Dark mode</Text>
          <Name>ui-dark</Name>
        </CheckboxOption>
      </Options>
    </CheckboxPage>
  </FeaturePages>
</Playbook>
