  - !task: {path: 'Tasks/converge.yml'}
  - !task: {path: 'Tasks/browser.yml'}
  - !task: {path: 'Tasks/appx.yml'}
  - !task: {path: 'Tasks/xbox.yml'}
  - !task: {path: 'Tasks/edge.yml'}
  - !task: {path: 'Tasks/onedrive.yml'}
  - !task: {path: 'Tasks/services.yml'}
  - !task: {path: 'Tasks/scheduled-tasks.yml'}
  - !task: {path: 'Tasks/privacy.yml'}
  - !task: {path: 'Tasks/updates.yml'}
  - !task: {path: 'Tasks/defender.yml'}
  - !task: {path: 'Tasks/gaming.yml'}
  - !task: {path: 'Tasks/developer.yml'}
  - !task: {path: 'Tasks/interface.yml'}
  - !task: {path: 'Tasks/finalize.yml'}
