title: Start
description: >-
  Copies the toolbox to C:\Windows\ClaudePlaybook and records the current value
  of everything the playbook changes (Backup\state.json). The playbook stops if
  the backup fails.
actions:
  - !status: {status: 'Backing up your settings'}
  # robocopy exit codes below 8 mean success. Backup and Logs from an earlier
  # run are kept.
  - !cmd:
    command: 'robocopy "ClaudePlaybook" "%windir%\ClaudePlaybook" /E /PURGE /XD Backup Logs /R:1 /W:1 /NP /NFL /NDL & if errorlevel 8 (exit 1) else (exit 0)'
    exeDir: true
    wait: true
    handleExitCodes: {1: halt}
  - !powerShell:
    command: '& $env:windir\ClaudePlaybook\Internal\Backup.ps1 -Silent; exit $LASTEXITCODE'
    wait: true
    handleExitCodes: {1: halt}
  - !powerShell:
    command: '& $env:windir\ClaudePlaybook\Internal\Appx.ps1 -Action Snapshot -Silent; exit $LASTEXITCODE'
    runas: currentUserElevated
    wait: true
    handleExitCodes: {1: halt}
